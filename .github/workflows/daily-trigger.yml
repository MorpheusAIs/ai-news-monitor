name: Daily AI News Trigger

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel webhook
        run: |
          DIRECT_WEBHOOK_URL="${{ secrets.WEBHOOK_URL }}"
          BASE_WEBHOOK_URL="${{ secrets.GROK_WEBHOOK_URL }}"
          DIRECT_WEBHOOK_URL="${DIRECT_WEBHOOK_URL%/}"
          BASE_WEBHOOK_URL="${BASE_WEBHOOK_URL%/}"

          if [ -n "$DIRECT_WEBHOOK_URL" ]; then
            WEBHOOK_URL="$DIRECT_WEBHOOK_URL"
          else
            WEBHOOK_URL="${BASE_WEBHOOK_URL%/api/grok}/api/run"
          fi

          if [ -z "$WEBHOOK_URL" ] || [ "$WEBHOOK_URL" = "/api/run" ]; then
            echo "WEBHOOK_URL or GROK_WEBHOOK_URL must be configured so the daily AI news trigger can target the Vercel deployment."
            exit 1
          fi

          BODY='{"trigger":"github-cron","timestamp":"'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'"}'
          SIGNATURE="sha256=$(echo -n "$BODY" | openssl dgst -sha256 -hmac "${{ secrets.WEBHOOK_SECRET }}" | awk '{print $2}')"

          HTTP_STATUS=$(curl -sS -o response.json -w "%{http_code}" -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "X-Webhook-Signature: $SIGNATURE" \
            -d "$BODY" \
            --max-time 150)

          cat response.json

          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "Webhook failed with HTTP $HTTP_STATUS"
            exit 1
          fi
