name: Daily Grok Alpha Trigger

on:
  schedule:
    - cron: '10 9 * * *'
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel Grok webhook
        run: |
          BODY='{"trigger":"github-cron","timestamp":"'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'"}'
          SIGNATURE="sha256=$(echo -n "$BODY" | openssl dgst -sha256 -hmac "${{ secrets.WEBHOOK_SECRET }}" | awk '{print $2}')"

          HTTP_STATUS=$(curl -sS -o response.json -w "%{http_code}" -X POST "${{ secrets.GROK_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -H "X-Webhook-Signature: $SIGNATURE" \
            -d "$BODY" \
            --max-time 120)

          cat response.json

          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "Webhook failed with HTTP $HTTP_STATUS"
            exit 1
          fi
