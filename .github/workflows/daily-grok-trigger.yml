name: Daily Grok Alpha Trigger

on:
  schedule:
    - cron: '10 9 * * *'
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel Grok webhook
        run: |
          BODY='{"trigger":"github-cron","timestamp":"'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'"}'
          SIGNATURE="sha256=$(echo -n "$BODY" | openssl dgst -sha256 -hmac "${{ secrets.WEBHOOK_SECRET }}" | awk '{print $2}')"

          GROK_URL="${{ secrets.WEBHOOK_URL }}"
          GROK_URL="${GROK_URL%/api/run}/api/grok"

          curl -sf -X POST "$GROK_URL" \
            -H "Content-Type: application/json" \
            -H "X-Webhook-Signature: $SIGNATURE" \
            -d "$BODY" \
            --max-time 120
